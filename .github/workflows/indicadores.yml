# Actualiza a diario una copia de los indicadores de mindicador.cl en la rama
# "datos" del repositorio (carpeta data/). La app la lee desde ahí, así no
# depende de que mindicador.cl permita consultas desde el navegador (CORS).
# Se usa una rama aparte para no agregar commits a "main": tus cargas con
# GitHub Desktop no se ven afectadas y el sitio no se vuelve a publicar.
name: Actualizar indicadores

on:
  schedule:
    - cron: '20 11 * * *'   # todos los días, 08:20 hora de Chile (invierno) / 07:20 (verano)
    - cron: '20 17 * * *'   # segundo intento en la tarde
  workflow_dispatch: {}      # botón "Run workflow" para ejecutarlo a mano

permissions:
  contents: write

concurrency:
  group: indicadores
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cambiar a la rama de datos
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin datos >/dev/null 2>&1; then
            git checkout -B datos origin/datos
          else
            git checkout --orphan datos
            git rm -rf --quiet . || true
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi

      - name: Descargar indicadores
        shell: bash
        run: |
          set -u
          mkdir -p data
          traer () {   # $1 = URL, $2 = archivo destino
            local tmp; tmp="$(mktemp)"
            for i in 1 2 3; do
              if curl -fsSL --max-time 40 -A "contabilidadme-indicadores" "$1" -o "$tmp" && jq -e . "$tmp" >/dev/null 2>&1; then
                jq -S . "$tmp" > "$2"; echo "OK  $1"; rm -f "$tmp"; return 0
              fi
              echo "Reintento $i de $1"; sleep 15
            done
            echo "::warning::No se pudo descargar $1 (se conserva el archivo anterior)"; rm -f "$tmp"; return 0
          }
          Y=$(date -u +%Y)
          traer "https://mindicador.cl/api" "data/indicadores.json"
          # Años completos desde 2023 (los cerrados casi nunca cambian; sólo se reescriben si difieren)
          for a in $(seq 2023 $Y); do
            traer "https://mindicador.cl/api/uf/$a"  "data/uf-$a.json"
            traer "https://mindicador.cl/api/utm/$a" "data/utm-$a.json"
          done

      - name: Guardar cambios
        shell: bash
        run: |
          git config user.name  "indicadores-bot"
          git config user.email "indicadores-bot@users.noreply.github.com"
          git add data/*.json || true
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Indicadores $(date -u +%Y-%m-%d)"
          git push origin datos
